<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오목 게임 (Gomoku)</title>
  <link rel="stylesheet" href="style.css">
  <script src="paho-mqtt.js"></script>
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>⚪ 오목 게임 (Gomoku) ⚫</h1>

      <!-- 모드 선택 탭 -->
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="online">🌐 친구와 온라인</button>
        <button class="mode-tab" data-mode="pve">🤖 AI 대전</button>
        <button class="mode-tab" data-mode="pvp">👥 폰 1개로 2인</button>
      </div>

      <!-- 온라인 방 관리 패널 -->
      <div id="onlinePanel" class="online-panel">
        <div id="roomCreateSection" class="room-action-row">
          <button id="createRoomBtn" class="btn btn-primary btn-sm">방 만들기 (초대 링크)</button>
          <div class="join-group">
            <input type="text" id="joinRoomInput" placeholder="방 번호 4자리" maxlength="6">
            <button id="joinRoomBtn" class="btn btn-secondary btn-sm">참여</button>
          </div>
        </div>

        <div id="roomActiveSection" class="room-info-card" style="display: none;">
          <div class="room-header">
            <span class="room-tag">방 번호: <strong id="currentRoomId">-</strong></span>
            <span id="networkStatus" class="status-badge waiting">상대 대기 중</span>
          </div>
          <div class="my-role">
            내 돌: <strong id="myStoneText">흑돌 (선공)</strong>
          </div>
          <div class="share-box">
            <button id="copyLinkBtn" class="btn btn-share">🔗 초대 링크 복사하기</button>
            <span id="copySuccessMsg" class="copy-tooltip">복사 완료! 친구에게 카톡으로 보내세요</span>
          </div>
        </div>
      </div>

      <!-- 현재 게임 상태 -->
      <div class="status-panel">
        <div class="turn-indicator">
          <span class="stone-icon" id="turnStone"></span>
          <span id="turnText">흑돌 차례</span>
        </div>
        <div id="gameHint" class="game-hint">내 차례입니다</div>
      </div>
    </header>

    <main class="board-wrapper">
      <canvas id="omokCanvas" width="600" height="600"></canvas>
    </main>

    <footer class="controls">
      <button id="undoBtn" class="btn btn-secondary">한 수 무르기</button>
      <button id="restartBtn" class="btn btn-primary">새 게임</button>
    </footer>

    <!-- 승리/패배 모달 -->
    <div id="winnerModal" class="modal">
      <div class="modal-content">
        <h2 id="winnerText">흑돌 승리! 🎉</h2>
        <p id="winnerDesc">5목을 완성했습니다.</p>
        <button id="modalRestartBtn" class="btn btn-primary">다시 시작하기</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
