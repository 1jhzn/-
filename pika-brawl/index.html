<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140b26">
<title>⚡ 피카츄 배구 BRAWL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- 인게임 HUD -->
  <div id="hud" class="hidden">
    <div class="sb">
      <div class="sb-team blue"><span class="tn">파랑</span><b id="score-blue">0</b></div>
      <div class="sb-sep">:</div>
      <div class="sb-team red"><b id="score-red">0</b><span class="tn">빨강</span></div>
    </div>
    <div class="goal">10점 선승</div>
    <div class="hud-right">
      <button id="btn-sound" class="icon-btn" aria-label="소리">🔊</button>
      <button id="btn-exit" class="icon-btn" aria-label="나가기">✕</button>
    </div>
    <div id="my-ult"><span class="label">궁극기</span><div class="bar"><i id="my-ult-fill"></i></div></div>
    <div id="toast"></div>
  </div>

  <!-- 터치 조작 -->
  <div id="controls" class="hidden">
    <div class="stick" id="stick"><div class="stick-ring"><div class="stick-knob" id="knob"></div></div></div>
    <div class="btns">
      <button id="btn-ult" class="abtn ult"><span>궁극기</span><span class="pct" id="ult-pct">0%</span></button>
      <button id="btn-attack" class="abtn attack"><span>스파이크</span><span>공격</span></button>
    </div>
  </div>

  <!-- 로비 -->
  <div id="lobby" class="overlay">
    <div class="lobby-card">
      <header class="brand">
        <div class="logo">⚡ 피카츄 배구 <em>BRAWL</em></div>
        <div class="stats">
          <span class="chip">🏆 <b id="trophies">0</b></span>
          <span class="chip">🏅 승리 <b id="wins">0</b></span>
          <span class="chip">🔥 <b id="streak">0</b>연승</span>
        </div>
      </header>

      <div class="tabs">
        <button class="tab active" data-mode="ai">🤖 AI 대전</button>
        <button class="tab" data-mode="online">🌐 친구랑 온라인</button>
      </div>

      <!-- AI 패널 -->
      <div id="panel-ai">
        <div class="section">
          <h3>팀 인원</h3>
          <div class="seg" id="size-seg">
            <button data-size="1">1 vs 1</button>
            <button data-size="2" class="active">2 vs 2</button>
            <button data-size="3">3 vs 3</button>
          </div>
        </div>
        <div class="section">
          <h3>상대 난이도</h3>
          <div class="seg" id="diff-seg">
            <button data-diff="easy">쉬움</button>
            <button data-diff="normal" class="active">보통</button>
            <button data-diff="hard">어려움</button>
          </div>
        </div>
      </div>

      <!-- 온라인 패널 -->
      <div id="panel-online" class="hidden">
        <div class="section">
          <h3>방 만들기 / 코드로 입장 (최대 3 vs 3 = 6명)</h3>
          <div class="row">
            <button class="big-btn" id="btn-create">🔧 방 만들기</button>
          </div>
          <div class="join-row">
            <input id="join-code" inputmode="numeric" maxlength="4" placeholder="방 코드 4자리" autocomplete="off">
            <button class="big-btn" id="btn-join" style="flex:0 0 32%">입장</button>
          </div>
          <p class="hint">빈 자리는 AI 봇이 채워서 바로 시작할 수 있어요!</p>
        </div>
      </div>

      <div class="section brawler-sec">
        <h3>브롤러 선택</h3>
        <div class="brawlers" id="brawler-list"></div>
      </div>

      <button class="play-btn" id="btn-play">플레이!</button>
    </div>
  </div>

  <!-- 대기방 -->
  <div id="screen-room" class="overlay hidden">
    <div class="lobby-card">
      <header class="room-head">
        <button id="btn-room-back" class="icon-btn" aria-label="뒤로">←</button>
        <div class="room-title">방 코드 <b id="room-code">----</b></div>
        <button id="btn-copy" class="mini">링크 복사</button>
      </header>
      <div class="teams">
        <div class="team-col blue">
          <h4>🔵 파랑팀 <span id="cnt-blue">0/3</span></h4>
          <ul id="roster-blue"></ul>
        </div>
        <div class="team-col red">
          <h4>🔴 빨강팀 <span id="cnt-red">0/3</span></h4>
          <ul id="roster-red"></ul>
        </div>
      </div>
      <div class="section">
        <h3>팀 인원</h3>
        <div class="seg" id="size-seg-online">
          <button data-size="1">1 vs 1</button>
          <button data-size="2" class="active">2 vs 2</button>
          <button data-size="3">3 vs 3</button>
        </div>
      </div>
      <button class="play-btn" id="btn-start">게임 시작</button>
      <div id="room-wait" class="hint hidden">호스트가 시작하기를 기다리는 중…</div>
      <div id="room-hint" class="hint">친구에게 코드를 알려 주세요. 빈 자리는 AI 봇으로 채워집니다.</div>
    </div>
  </div>

  <!-- 결과 -->
  <div id="screen-result" class="overlay hidden">
    <div class="result-card">
      <div class="res-badge" id="res-badge">승리!</div>
      <div class="res-score" id="res-score">5 : 3</div>
      <div class="res-trophy" id="res-trophy">🏆 +8 트로피</div>
      <div class="res-mvp" id="res-mvp"></div>
      <div class="res-btns">
        <button class="play-btn" id="btn-again">다시 하기</button>
        <button class="big-btn" id="btn-home" style="width:100%">로비로</button>
      </div>
    </div>
  </div>
</div>

<script src="paho-mqtt.js"></script>
<script src="brawlers.js"></script>
<script src="game.js"></script>
<script src="net.js"></script>
</body>
</html>
